name: Deploy MidiStudio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install pinned Verovio package
        run: npm install --prefix /tmp/verovio verovio@6.4.1

      - name: Prepare local notation engine
        run: |
          mkdir -p vendor
          cp /tmp/verovio/node_modules/verovio/dist/verovio-toolkit-wasm.js vendor/verovio-toolkit-wasm.js
          cp /tmp/verovio/node_modules/verovio/LICENSE vendor/VEROVIO-LICENSE.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
